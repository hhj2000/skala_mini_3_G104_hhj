<text x="500" y="1165" class="body">높은 중복 경고는 확인 후 저장 가능</text>
<text x="500" y="1193" class="body">생성만으로 저장하지 않음 · SQLite에 영구 기록</text>
<path d="M480 1160 H355 V530 H335" class="edge"/>
<text x="370" y="1145" class="small">저장</text>
<rect x="45" y="680" width="290" height="220" rx="14" fill="#e7f5ee" stroke="#74a78c" stroke-width="2"/>
