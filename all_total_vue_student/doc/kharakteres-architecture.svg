<text x="65" y="773" class="body">코사인 유사도 → 생성 맥락</text>
<text x="65" y="801" class="body">수정 재임베딩·삭제 반영</text>
<text x="65" y="829" class="body">준비 실패는 대체 조회 고지</text>
<text x="65" y="857" class="body">웹 어휘 조회는 생성 이후의</text>
<text x="65" y="885" class="body">근거 확인 단계로 분리</text>
<rect x="1190" y="140" width="360" height="150" rx="14" fill="#ffffff" stroke="#c2cfdb" stroke-width="2"/>
<text x="1210" y="173" class="heading">음성 입력 · STT</text>
