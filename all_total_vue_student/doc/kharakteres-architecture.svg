<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1430" viewBox="0 0 1600 1430" role="img" aria-labelledby="title desc"><title id="title">Kharakteres 현재 서비스 아키텍처</title><desc id="desc">회원가입·로그인 이후 계정별 주문사전을 사용하는 Kharakteres 구조. FastAPI 인증 미들웨어, 사용자별 SQLite와 벡터 인덱스, 임시 시크릿 서고, LangGraph 순차 생성·검토, STT/TTS, LangSmith 추적, Docker 영구 볼륨을 표시. 시크릿 모드에서는 LangSmith tracing을 끄며 독립 멀티 에이전트와 MCP는 사용하지 않음.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647a"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#1c2f45} .title{font-size:34px;font-weight:700}.heading{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#52647a}.edge{fill:none;stroke:#52647a;stroke-width:2.3;marker-end:url(#arrow)}</style><rect width="1600" height="1430" fill="#f4f7fa"/><text x="45" y="58" class="title">Kharakteres · 현재 구현 구조</text><text x="45" y="93" class="body">현재 기본 경로: SERVICE_MODE=spells · 2026-10-21 · 과거 장애 진단 서비스는 별도 보존</text>
<rect x="365" y="395" width="790" height="670" rx="22" fill="#eaf1f9" stroke="#8baac8" stroke-dasharray="8 6"/><text x="385" y="385" class="heading">LangGraph · 순차 실행</text>
<rect x="480" y="140" width="560" height="80" rx="14" fill="#ffffff" stroke="#c2cfdb" stroke-width="2"/>
<text x="500" y="173" class="heading">사용자 · Vue 웹 화면</text>
<text x="500" y="205" class="body">지원 언어 229개 · 가나다순 · 계정별 서고</text>
<rect x="480" y="270" width="560" height="80" rx="14" fill="#ffffff" stroke="#c2cfdb" stroke-width="2"/>
<text x="500" y="303" class="heading">FastAPI · 인증 미들웨어·요청 처리</text>
<text x="500" y="335" class="body">계정당 1세션 · 로그인 복원 · 콘텐츠 필터 · SSE</text>
<path d="M760 220 V270" class="edge"/>
<path d="M760 350 V420" class="edge"/>
<rect x="480" y="420" width="560" height="105" rx="14" fill="#e7f5ee" stroke="#74a78c" stroke-width="2"/>
<text x="500" y="453" class="heading">1. retrieve_lexicon · 벡터 주문 RAG</text>
<text x="500" y="485" class="body">같은 세계관에서 코사인 점수 기준 최대 12개</text>
<text x="500" y="513" class="body">다국어 ONNX 임베딩 · 생성 프롬프트에 맥락 제공</text>
<rect x="45" y="420" width="290" height="140" rx="14" fill="#ffffff" stroke="#c2cfdb" stroke-width="2"/>
<text x="65" y="453" class="heading">SQLite · 계정별 저장</text>
<text x="65" y="485" class="body">accounts.sqlite · 계정·세션</text>
<text x="65" y="513" class="body">users/&lt;id&gt;/spells.sqlite · 주문</text>
<text x="65" y="541" class="body">계정별 벡터 인덱스</text>
<path d="M335 480 H480" class="edge"/>
