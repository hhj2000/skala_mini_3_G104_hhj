<text x="65" y="1350" class="body">로컬·Docker 공통 로그인 · 새 로그인 우선 · 영구 볼륨 · docker compose up --build -d</text><text x="65" y="1378" class="body">시크릿 종료/교체 시 임시 DB 폐기 · 현대 209 / 고전 17 / 사멸 3 · Multi-Agent/MCP 미도입</text>
