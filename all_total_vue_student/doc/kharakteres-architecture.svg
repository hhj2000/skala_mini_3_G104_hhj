<text x="810" y="645" class="body">작가의 원문·발음·의미 보존</text>
<text x="810" y="673" class="body">IPA는 선택 · 언어 생성 생략</text>
<text x="810" y="701" class="body">효과·속성·제약을 함께 기록</text>
