<path d="M760 350 V420" class="edge"/>
<rect x="480" y="420" width="560" height="105" rx="14" fill="#e7f5ee" stroke="#74a78c" stroke-width="2"/>
<text x="500" y="453" class="heading">1. retrieve_lexicon · 벡터 주문 RAG</text>
<text x="500" y="485" class="body">같은 세계관에서 코사인 점수 기준 최대 12개</text>
<text x="500" y="513" class="body">다국어 ONNX 임베딩 · 생성 프롬프트에 맥락 제공</text>
<rect x="45" y="420" width="290" height="140" rx="14" fill="#ffffff" stroke="#c2cfdb" stroke-width="2"/>
<text x="65" y="453" class="heading">SQLite · 영구 주문사전</text>
<text x="65" y="485" class="body">저장된 주문 + 수정 버전</text>
<text x="65" y="513" class="body">별도 SQLite 벡터 캐시</text>
<text x="65" y="541" class="body">키워드 / 의미 검색 선택</text>
