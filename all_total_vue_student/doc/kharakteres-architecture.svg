<text x="1210" y="1063" class="body">STT/TTS 실행 메타데이터 추적</text>
<text x="1210" y="1091" class="body">콘텐츠 차단 기능은 수행하지 않음</text>
<rect x="45" y="1300" width="1510" height="90" rx="14" fill="#fff0ef" stroke="#d69691" stroke-width="2"/>
