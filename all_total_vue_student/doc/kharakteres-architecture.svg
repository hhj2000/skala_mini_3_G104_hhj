<rect x="480" y="1100" width="560" height="120" rx="14" fill="#ffffff" stroke="#c2cfdb" stroke-width="2"/>
<text x="500" y="1133" class="heading">초안 표시 → 사용자 편집·검토 → 저장</text>
<text x="500" y="1165" class="body">높은 중복 경고는 확인 후 저장 가능</text>
<text x="500" y="1193" class="body">생성만으로 저장하지 않음 · SQLite에 영구 기록</text>
<path d="M480 1160 H355 V530 H335" class="edge"/>
<text x="370" y="1145" class="small">저장</text>
<rect x="45" y="680" width="290" height="220" rx="14" fill="#e7f5ee" stroke="#74a78c" stroke-width="2"/>
<text x="65" y="713" class="heading">현재 RAG의 범위</text>
<text x="65" y="745" class="body">로컬 ONNX 384차원 임베딩</text>
<text x="65" y="773" class="body">코사인 유사도 → 생성 맥락</text>
<text x="65" y="801" class="body">수정 재임베딩·삭제 반영</text>
<text x="65" y="829" class="body">준비 실패는 대체 조회 고지</text>
<text x="65" y="857" class="body">시크릿 모드는 임시 SQLite를 쓰고</text>
<text x="65" y="885" class="body">종료 시 주문·벡터 데이터 폐기</text>
<rect x="1190" y="140" width="360" height="150" rx="14" fill="#ffffff" stroke="#c2cfdb" stroke-width="2"/>
<text x="1210" y="173" class="heading">음성 입력 · STT</text>
<text x="1210" y="205" class="body">마이크·파일 → Whisper</text>
