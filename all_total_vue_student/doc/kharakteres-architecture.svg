<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1430" viewBox="0 0 1600 1430" role="img" aria-labelledby="title desc"><title id="title">Kharakteres 현재 서비스 아키텍처</title><desc id="desc">LangGraph 순차 워크플로, SQLite 기반 제한적 RAG, 작가 정의 인공어, 생성 후 웹 어휘 검증, 음성 API와 선택적 AI 검토. 콘텐츠 필터와 다국어 벡터 주문 RAG 적용. 독립 멀티 에이전트는 미도입이며 MCP는 보존된 Base에만 사용.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647a"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#1c2f45} .title{font-size:34px;font-weight:700}.heading{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#52647a}.edge{fill:none;stroke:#52647a;stroke-width:2.3;marker-end:url(#arrow)}</style><rect width="1600" height="1430" fill="#f4f7fa"/><text x="45" y="58" class="title">Kharakteres · 현재 구현 구조</text><text x="45" y="93" class="body">기준: 기본 SERVICE_MODE=spells · 2026-10-20 코드 · 보존된 장애 진단 서비스와 구분</text>
<rect x="365" y="395" width="790" height="670" rx="22" fill="#eaf1f9" stroke="#8baac8" stroke-dasharray="8 6"/><text x="385" y="385" class="heading">LangGraph · 순차 실행</text>
<rect x="480" y="140" width="560" height="80" rx="14" fill="#ffffff" stroke="#c2cfdb" stroke-width="2"/>
<text x="500" y="173" class="heading">사용자 · Vue 웹 화면</text>
<text x="500" y="205" class="body">효과·언어·속성·세계관 입력</text>
<rect x="480" y="270" width="560" height="80" rx="14" fill="#ffffff" stroke="#c2cfdb" stroke-width="2"/>
<text x="500" y="303" class="heading">FastAPI · 콘텐츠 검사·언어 해석</text>
<text x="500" y="335" class="body">욕설·혐오·현실 정치 검사 → 요청 검증</text>
