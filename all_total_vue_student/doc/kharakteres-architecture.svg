<text x="410" y="645" class="body">기존 주문 + 요청 → LLM</text>
<text x="410" y="673" class="body">원문·한글 전사·IPA·의미</text>
<text x="410" y="701" class="body">OpenAI 또는 Ollama</text>
<rect x="790" y="580" width="340" height="125" rx="14" fill="#fff6df" stroke="#d1b56c" stroke-width="2"/>
<text x="810" y="613" class="heading">2. compose_spell · 인공어</text>
