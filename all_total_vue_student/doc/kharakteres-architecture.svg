<text x="410" y="858" class="body">제공자·응답 링크·확인 시각</text>
<text x="410" y="886" class="body">생성 후 검증 · 재생성 없음</text>
<rect x="790" y="765" width="340" height="125" rx="14" fill="#fff6df" stroke="#d1b56c" stroke-width="2"/>
